# Optional legacy import only — prefer **Settings → Devices & services → Add integration → Beat81**.
# If you keep this block, Home Assistant will import it once into a config entry; then remove this YAML.
# Put the real token in secrets.yaml — never commit it.

beat81:
  token: !secret beat81_token
  # user_id: "optional-uuid-if-jwt-has-no-user-id"
  scan_interval:
    minutes: 15

