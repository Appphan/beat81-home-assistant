# Add as a new Lovelace dashboard (Raw configuration editor) or merge into an existing view.
# Entity IDs include your account id, e.g. calendar.beat81_<id>_classes and calendar.beat81_<id>_next_bookings.

title: Beat81
views:
  - title: Beat81
    path: beat81
    icon: mdi:dumbbell
    cards:
      - type: markdown
        content: |
          **Token:** set in the Beat81 integration (UI) or via YAML import. When auth fails, remove the integration and add it again with a new JWT.

      - type: calendar
        title: All classes (booked + waitlist)
        entities:
          - calendar.beat81_classes
        initial_view: dayGridMonth

      - type: calendar
        title: Next bookings (confirmed only)
        entities:
          - calendar.beat81_next_bookings
        initial_view: listWeek

      - type: horizontal-stack
        cards:
          - type: tile
            entity: sensor.beat81_status
            name: Bookings
            icon: mdi:dumbbell
          - type: tile
            entity: button.beat81_promote_waitlist
            name: Promote waitlist
            icon: mdi:seat-passenger
            color: amber

      - type: entities
        title: Details
        entities:
          - entity: sensor.beat81_status
            secondary_info: last-changed
          - entity: button.beat81_promote_waitlist

      - type: markdown
        title: Waitlist data
        content: |
          In **Developer tools → States**, open `sensor.beat81_status` and read attribute **`waitlist`**
          (`can_promote_now`, `spots_open`, `same_day_blocked`). After a promotion attempt, see **`last_promote_log`**.
