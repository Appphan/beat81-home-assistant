# Add as a new Lovelace dashboard (Raw configuration editor) or merge into an existing view.
# Entity IDs default to calendar.beat81_classes, sensor.beat81_status, button.beat81_promote_waitlist.

title: Beat81
views:
  - title: Beat81
    path: beat81
    icon: mdi:dumbbell
    cards:
      - type: markdown
        content: |
          **Token:** set in `secrets.yaml` as `beat81_token`. Renew with **beat81_bot** when auth fails.

      - type: calendar
        entities:
          - calendar.beat81_classes
        initial_view: dayGridMonth

      - type: horizontal-stack
        cards:
          - type: tile
            entity: sensor.beat81_status
            name: Bookings
            icon: mdi:dumbbell
          - type: tile
            entity: button.beat81_promote_waitlist
            name: Promote waitlist
            icon: mdi:seat-passenger
            color: amber

      - type: entities
        title: Details
        entities:
          - entity: sensor.beat81_status
            secondary_info: last-changed
          - entity: button.beat81_promote_waitlist

      - type: markdown
        title: Waitlist data
        content: |
          In **Developer tools → States**, open `sensor.beat81_status` and read attribute **`waitlist`**
          (`can_promote_now`, `spots_open`, `same_day_blocked`). After a promotion attempt, see **`last_promote_log`**.
