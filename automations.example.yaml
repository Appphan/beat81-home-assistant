# Copy into automations.yaml (or split with !include_dir_merge_list), or use as a blueprint.
# Replace ENTITY_ID placeholders using Developer tools → States (search "beat81").

# --- 1) Force refresh (usually unnecessary) ---
# Prefer Beat81 → Configure → poll interval (e.g. 5 seconds). Only use this if you need
# refreshes *on top of* the configured interval.
# - id: beat81_force_refresh
#   alias: Beat81 — force data refresh
#   mode: single
#   trigger:
#     - platform: time_pattern
#       seconds: "/5"
#   action:
#     - action: homeassistant.update_entity
#       target:
#         entity_id: sensor.beat81_YOUR_USER_ID_status

# --- 2) Auto-promote when the binary sensor says a spot is available ---
# (Or enable auto-promote in Beat81 → Configure instead of this automation.)
- id: beat81_auto_promote_when_ready
  alias: Beat81 — auto promote waitlist when ready
  description: Runs promote_waitlist when waitlist_promote_ready turns on (same rules as the button).
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: binary_sensor.beat81_YOUR_USER_ID_waitlist_promote_ready
      to: "on"
      for:
        seconds: 10
  action:
    - action: beat81.promote_waitlist

